<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>GAPAK Frontend Platform</title>
    <!-- Moved out of an inline <script> block: CSP (script-src 'self', no
         'unsafe-inline'/nonce) blocks inline scripts on the deployed site.
         A same-origin file passes 'self' and runs before the module script
         below (plain scripts execute synchronously, before deferred
         type="module" scripts, so ordering is unchanged). -->
    <script src="/fetch-guard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
